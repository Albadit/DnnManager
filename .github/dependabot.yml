version: 2
# Updates for the GitHub Actions the workflows pin to commits, and for the Rust crates - proposed as pull requests,
# which CI builds and tests.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
