# CI: every push and pull request is built and tested on Windows, Linux and macOS. A release (release.yml) is built
# only from a commit this passed.
#
#   windows  build, the tests, clippy - DNN Manager's real platform (IIS)
#   linux    build and the tests - the app opens there, without IIS
#   macos    build - the app opens there, without IIS
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: cargo build --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # rust-toolchain.toml pins the Windows (MSVC) toolchain; elsewhere the host's stable one builds.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: GPUI's build dependencies
        run: bash scripts/linux-deps.sh
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --workspace --locked
