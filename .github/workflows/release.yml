# Release: pushing a version tag (vX.Y.Z or vX.Y.Z-rc1, made by the VS Code task "Release: Github" -
# scripts/release.ps1) builds, tests and publishes that tag. Nothing built on a PC is uploaded. See .docs/releasing.md.
#
#   plan      the tag is a version; its release type (Latest / Pre-release / None) from the tag's message
#             ("Release-Label: ..."); no release with that tag exists already; and CI (ci.yml) passed on the tagged
#             commit - it waits for that run, and stops when it failed, was cancelled or never ran. Nothing is tested
#             twice: CI's build, clippy and tests on Windows, Linux and macOS are the release's.
#   package   only then: one job per installer, the tag's version written into the build
#             (scripts/set-version.py), built clean (-D warnings) and packaged with cargo-packager (Packager.toml):
#               DnnManager-windows-x86_64.msi   DnnManager-windows-arm64.msi
#               DnnManager-macos-arm64.dmg      DnnManager-macos-x86_64.dmg
#               DnnManager-linux-amd64.deb      DnnManager-linux-arm64.deb
#   publish   only when all six were made, in the environment "publish" (give it a required reviewer to approve each
#             release): checks that the files are exactly the installers - never an executable -, adds the two .debs
#             under their other names (x86_64 = amd64, aarch64 = arm64) and SHA256SUMS.txt, uploads them to a draft
#             release, checks every file arrived, and only then publishes it with its type and notes
#             (.docs/release-notes/<tag>.md, else GitHub's notes from the commits). A failure removes the draft:
#             no release is ever left half made.
#
# The installers are not code-signed: Windows SmartScreen and macOS Gatekeeper warn on first start.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.ref_name }}
  # The packager's version, pinned like the actions: a release is built with what was tried.
  PACKAGER_VERSION: 0.11.8

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    # It waits for CI on the commit - up to an hour.
    timeout-minutes: 75
    permissions:
      contents: read
      # Read CI's runs on the commit.
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - name: Version and release type from the tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.]*)?$ ]]; then
            echo "::error::$TAG isn't a version tag (vX.Y.Z or vX.Y.Z-suffix)."; exit 1
          fi
          # The type chosen in VS Code, from the annotated tag's message; a tag without one: Latest, or a pre-release
          # when it has a suffix.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          label=""
          if [ "$(jq -r '.object.type' <<<"$ref")" = "tag" ]; then
            sha=$(jq -r '.object.sha' <<<"$ref")
            label=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' |
              sed -nE 's/^Release-Label: *([a-z]+).*/\1/p' | head -n 1)
          fi
          if [ -z "$label" ]; then case "$version" in *-*) label=prerelease ;; *) label=latest ;; esac; fi
          case "$label" in latest|prerelease|none) ;; *) echo "::error::Unknown release type '$label'."; exit 1 ;; esac
          if [ "$label" = prerelease ] && [[ "$version" != *-* ]]; then
            echo "::error::A pre-release needs a version with a suffix (v$version-rc1)."; exit 1
          fi
          if [ "$label" != prerelease ] && [[ "$version" == *-* ]]; then
            echo "::error::$TAG has a suffix but is labelled $label - a suffix makes it a pre-release."; exit 1
          fi
          # A tag released already is never released again.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "::error::$TAG is published already."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Release $TAG - version $version, type $label"

      - name: CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          echo "Waiting for CI on $sha"
          for attempt in $(seq 1 120); do
            # The newest CI run of a push of this commit (a re-run counts as that run).
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=50" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty')
            if [ -z "$run" ]; then
              if [ "$attempt" -ge 10 ]; then
                echo "::error::CI never ran on $sha - push the branch with this commit, let CI pass, then release it."; exit 1
              fi
            else
              status=$(jq -r '.status' <<<"$run"); conclusion=$(jq -r '.conclusion' <<<"$run"); url=$(jq -r '.html_url' <<<"$run")
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then echo "CI passed: $url"; exit 0; fi
                echo "::error::CI on $sha ended '$conclusion' - nothing is released. Fix it (or re-run CI) and release again: $url"; exit 1
              fi
              echo "CI is $status ($url) - waiting"
            fi
            sleep 30
          done
          echo "::error::CI on $sha didn't finish within an hour."; exit 1

  package:
    name: ${{ matrix.name }}
    needs: plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            toolchain: stable-x86_64-pc-windows-msvc
            format: wix
            ext: msi
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            toolchain: stable-aarch64-pc-windows-msvc
            format: wix
            ext: msi
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            toolchain: stable
            format: dmg
            ext: dmg
          - name: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            toolchain: stable
            format: dmg
            ext: dmg
          - name: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            toolchain: stable
            format: deb
            ext: deb
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            toolchain: stable
            format: deb
            ext: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh

      - name: Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }}

      - name: cargo-packager
        run: cargo install cargo-packager --version "$PACKAGER_VERSION" --locked

      - name: WiX 3.14 (Windows)
        # cargo-packager 0.11.8 downloads WiX 3.11, whose candle has no -arch arm64. It uses a WixTools folder that is
        # already there (in %LOCALAPPDATA%\.cargo-packager) instead: WiX 3.14.1, the hash pinned. Both Windows
        # installers are made with it; Packager.toml's template adds ARM64.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw "wix314-binaries.zip has SHA256 $hash - not the WiX 3.14.1 that was tried"
          }
          $wix = Join-Path $env:LOCALAPPDATA '.cargo-packager\WixTools'
          if (Test-Path $wix) { Remove-Item $wix -Recurse -Force }
          Expand-Archive $zip -DestinationPath $wix
          if (-not (Test-Path (Join-Path $wix 'candle.exe'))) { throw "No candle.exe in $wix" }
          "WiX $((Get-Item (Join-Path $wix 'candle.exe')).VersionInfo.FileVersion) in $wix"

      - name: The tag's version into the build
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python scripts/set-version.py "$VERSION"; else python3 scripts/set-version.py "$VERSION"; fi

      - name: Build (clean, warnings are errors)
        # RUSTFLAGS only here - not for cargo install above, whose own warnings aren't ours.
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --locked -p dnnmanager --target ${{ matrix.target }}

      - name: Package
        # cargo-packager takes the executable from its output folder.
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/DnnManager${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.format }} --out-dir dist

      - name: Name and check the installer
        run: |
          mkdir -p out
          file=$(find dist -maxdepth 2 -name "*.${{ matrix.ext }}" | head -n 1)
          if [ -z "$file" ]; then echo "::error::No .${{ matrix.ext }} was made"; ls -R dist; exit 1; fi
          size=$(wc -c < "$file")
          if [ "$size" -lt 1000000 ]; then echo "::error::$file is only $size bytes"; exit 1; fi
          cp "$file" "out/DnnManager-${{ matrix.name }}.${{ matrix.ext }}"
          ls -l out

      # Only the installer goes on: never the executable.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/DnnManager-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, package]
    runs-on: ubuntu-24.04
    environment: publish
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      LABEL: ${{ needs.plan.outputs.label }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Exactly the installers
        run: |
          cd artifacts
          expected="DnnManager-linux-amd64.deb DnnManager-linux-arm64.deb DnnManager-macos-arm64.dmg DnnManager-macos-x86_64.dmg DnnManager-windows-arm64.msi DnnManager-windows-x86_64.msi"
          actual=$(ls -1 | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected exactly: $expected"; echo "::error::Got: $actual"; exit 1
          fi
          cp DnnManager-linux-amd64.deb DnnManager-linux-x86_64.deb
          cp DnnManager-linux-arm64.deb DnnManager-linux-aarch64.deb
          sha256sum DnnManager-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Draft release with every file
        run: |
          notes=".docs/release-notes/$TAG.md"
          args=(--draft --title "DNN Manager $VERSION" --verify-tag --repo "$GITHUB_REPOSITORY")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          # A draft a failed run left behind goes first - only a draft: a published release is never touched.
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$state" = true ]; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
          elif [ "$state" = false ]; then
            echo "::error::$TAG is published already."; exit 1
          fi
          gh release create "$TAG" artifacts/* "${args[@]}"

      - name: Every file arrived
        run: |
          want=$(ls -1 artifacts | sort)
          got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort)
          if [ "$want" != "$got" ]; then
            echo "::error::The draft doesn't have every file."; echo "want: $want"; echo "got: $got"; exit 1
          fi

      - name: Publish
        run: |
          case "$LABEL" in
            latest) flags=(--latest --prerelease=false) ;;
            prerelease) flags=(--prerelease --latest=false) ;;
            none) flags=(--latest=false --prerelease=false) ;;
          esac
          gh release edit "$TAG" --draft=false "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          echo "Published $TAG ($LABEL): https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Remove the draft after a failure
        if: failure()
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
            echo "The draft release was removed - nothing was published."
          fi
