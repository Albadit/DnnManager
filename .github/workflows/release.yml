# Release: pushing a version tag (vX.Y.Z, by the VS Code task "Release" - scripts/release.ps1) builds that tag on
# GitHub and publishes it. Nothing built on a PC is uploaded. See .docs/releasing.md.
#
#   check    the tag is the version in Cargo.toml (and Packager.toml)
#   package  one job per platform: build the release exe and package it with cargo-packager (Packager.toml)
#              DnnManager-windows-x86_64.msi   DnnManager-windows-arm64.msi
#              DnnManager-macos-arm64.dmg      DnnManager-macos-x86_64.dmg
#              DnnManager-linux-amd64.deb      DnnManager-linux-arm64.deb
#   publish  in the environment "publish" (add a required reviewer there to approve each release): the Linux packages
#            also under their other names (x86_64 = amd64, aarch64 = arm64), SHA256SUMS.txt, then the release - its
#            notes from .docs/release-notes/<tag>.md when there is one, a pre-release for a tag with a suffix (v2.0.0-rc1).
#
# The packages are not code-signed: Windows SmartScreen and macOS Gatekeeper warn on first start.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  # The packager's version, pinned like the actions: a release is built with what was tried.
  PACKAGER_VERSION: 0.11.8

jobs:
  check:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compare
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          base="${TAG#v}"; base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::The tag $TAG doesn't match the version $version in Cargo.toml."
            exit 1
          fi
          packager=$(grep -m1 '^version = ' Packager.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$packager" != "$version" ]; then
            echo "::error::Packager.toml has version $packager, Cargo.toml $version."
            exit 1
          fi

  package:
    name: ${{ matrix.name }}
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            toolchain: stable-x86_64-pc-windows-msvc
            format: wix
            ext: msi
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            toolchain: stable-aarch64-pc-windows-msvc
            format: wix
            ext: msi
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            toolchain: stable
            format: dmg
            ext: dmg
          - name: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            toolchain: stable
            format: dmg
            ext: dmg
          - name: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            toolchain: stable
            format: deb
            ext: deb
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            toolchain: stable
            format: deb
            ext: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh

      - name: Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }}

      - name: cargo-packager
        run: cargo install cargo-packager --version "$PACKAGER_VERSION" --locked

      - name: Build
        run: cargo build --release --locked -p dnnmanager --target ${{ matrix.target }}

      - name: Package
        # cargo-packager takes the exe from its output folder.
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/DnnManager${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.format }} --out-dir dist

      - name: Name it
        run: |
          mkdir -p out
          file=$(find dist -maxdepth 2 -name "*.${{ matrix.ext }}" | head -n 1)
          if [ -z "$file" ]; then echo "::error::No .${{ matrix.ext }} in dist"; ls -R dist; exit 1; fi
          cp "$file" "out/DnnManager-${{ matrix.name }}.${{ matrix.ext }}"
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-24.04
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Linux names, checksums
        run: |
          cd artifacts
          cp DnnManager-linux-amd64.deb DnnManager-linux-x86_64.deb
          cp DnnManager-linux-arm64.deb DnnManager-linux-aarch64.deb
          sha256sum DnnManager-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".docs/release-notes/$TAG.md"
          args=(--title "DNN Manager ${TAG#v}" --verify-tag)
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          case "$TAG" in *-*) args+=(--prerelease) ;; *) args+=(--latest) ;; esac
          gh release create "$TAG" artifacts/* "${args[@]}" --repo "$GITHUB_REPOSITORY"
