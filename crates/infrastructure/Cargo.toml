[package]
name = "dnnm-infrastructure"
description = "IIS, files, SQLite and Windows for DNN Manager (the C# DnnManager.Infrastructure)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnnm-application.workspace = true
# FileZilla's passwords in an exported Site Manager file.
base64 = "0.23"
log.workspace = true
roxmltree.workspace = true
rusqlite.workspace = true
# Source Control's content hashes.
sha2 = "0.11"
# Source Control's watch on a project's folder (ReadDirectoryChangesW, FSEvents, inotify).
notify = "9"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_HttpServer",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# macOS and Linux: memory, processor use and the disks for the status bar (Windows reads them itself).
[target.'cfg(not(windows))'.dependencies.sysinfo]
version = "0.31.4"
default-features = false
features = ["system", "disk"]

[dev-dependencies]
tempfile.workspace = true
