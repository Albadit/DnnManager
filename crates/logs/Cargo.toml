[package]
name = "dnnm-logs"
description = "A site's logs for the Logs tab, and DNN Manager's own daily log file (the C# SiteLogs, DailyLogFile, ActivityLog)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnnm-application.workspace = true
dnnm-infrastructure.workspace = true
log = { workspace = true, features = ["std"] }
regex = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Time",
]

[dev-dependencies]
tempfile.workspace = true
