[package]
name = "dnnm-diagnostics"
description = "What a site's Details view shows: web.config, assemblies, folders, IIS and the database, as tabs of sections and rows (the C# Diagnostics and ProjectDiagnostics)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnnm-application.workspace = true
dnnm-infrastructure.workspace = true
roxmltree.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
]

[dev-dependencies]
tempfile.workspace = true
