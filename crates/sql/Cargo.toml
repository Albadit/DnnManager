[package]
name = "dnnm-sql"
description = "SQL Server for DNN Manager: site databases, the Docker SQL container, sqlcmd, SqlPackage and DNN's membership passwords (the C# Infrastructure/Sql, Docker and Dnn/MembershipPasswords)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnnm-application.workspace = true
dnnm-infrastructure.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = "0.4"

# On Windows: TDS over TCP and named pipes; Windows authentication through SSPI; TLS through Windows' own (schannel),
# so "a certificate Windows trusts" means what it means for SqlClient.
[target.'cfg(windows)'.dependencies.tiberius]
version = "0.13"
default-features = false
features = ["tds73", "winauth", "native-tls", "sql-browser-tokio"]

# Elsewhere (macOS, Linux): SQL logins only, TLS through rustls - no OpenSSL to install.
[target.'cfg(not(windows))'.dependencies.tiberius]
version = "0.13"
default-features = false
features = ["tds73", "rustls", "sql-browser-tokio"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[dev-dependencies]
tempfile.workspace = true
