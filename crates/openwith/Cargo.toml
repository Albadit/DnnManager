[package]
name = "dnnm-openwith"
description = "The project menu's \"Open with\": the code editors, IDEs and SQL Server Management Studio found on this PC, started as the user (the C# IdeLocator, Unelevated, SsmsConnectDialog and SecretClipboard)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnnm-sql = { path = "../sql" }

[target.'cfg(windows)'.dependencies]
serde_json = "1"
dnnm-system = { path = "../system" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true
