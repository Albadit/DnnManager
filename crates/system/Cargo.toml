[package]
name = "dnnm-system"
description = "DNN Manager's Windows services: hosts file, secrets, file locks and safe files, sign-in task, prerequisites, self-update, single instance and efficiency mode."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.23"
dnnm-application.workspace = true
dnnm-infrastructure.workspace = true
idna = "1"
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = "3"

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# The macOS Keychain and Linux's Secret Service for the secrets (Windows uses its Credential Manager directly); the
# Secret Service through zbus and RustCrypto - no libdbus or OpenSSL to build or install.
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
