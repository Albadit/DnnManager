[package]
name = "dnnm-tray"
description = "DNN Manager's icon in the notification area (the C# Services/TrayIcon): Open, Quit, and a notice while hidden."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

