[package]
name = "dnnm-keepwarm"
description = "Keeps the IIS sites switched to \"keep warm\" warm while DNN Manager runs (the C# DnnManager.Infrastructure.KeepWarm)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dnnm-application.workspace = true
log.workspace = true
rusqlite.workspace = true
# No gzip: the C# requester asks for no compression either; rustls for https to a local site.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Time",
]

[dev-dependencies]
tempfile.workspace = true
